# Skill Factory wiring, as a profile-patch fragment. Paste these entries into a
# profile's cordis.patch.yml (for the Web profile:
# $DSH_HOME/profiles/web/cordis.patch.yml) after the package is installed and
# built, then restart that profile.
#
# Three entries:
#   - skill-factory-host: the host service. Skip it when the profile already
#     lists @deepseek-ai/dsh-experimental-skill-factory in dsh.profile.bundles,
#     whose own patch inserts the same row.
#   - preset-skill-factory: the shipped `standard` composition plus two rows —
#     tool-session-query (prior-session tools for a manual review) and
#     skill-factory-tool (skill_factory_distill and skill_factory_status).
#     Both rows resolve from this bundle's own dependencies, so a profile that
#     installed the package needs no separate install for them; a profile
#     patch that names a plugin nothing supplies leaves that row pending and
#     marks the whole preset unusable.
#   - session-query-sqlite: moves from `openAt: never` to `first-search` so
#     those two search tools work; every other tool is unchanged.

- insert:
    - id: skill-factory-host
      name: '@deepseek-ai/dsh-experimental-skill-factory'

    - id: preset-skill-factory
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: skill-factory
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          - id: skill-factory-tool
            name: '@deepseek-ai/dsh-experimental-skill-factory/tool'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

    # Lazy full-text index: the search tools open it on their first call and
    # never during startup.
    - id: session-query-sqlite
      config:
        openAt: first-search
